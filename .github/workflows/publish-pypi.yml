name: Publish wadaya-moving-kit

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the prepared release distributions
        run: |
          mkdir dist
          curl --fail --location --output dist/wadaya_moving_kit-0.1.0-py3-none-any.whl https://github.com/wadaya-self-storage/storage-space-calculator/releases/download/v0.1.0/wadaya_moving_kit-0.1.0-py3-none-any.whl
          curl --fail --location --output dist/wadaya_moving_kit-0.1.0.tar.gz https://github.com/wadaya-self-storage/storage-space-calculator/releases/download/v0.1.0/wadaya_moving_kit-0.1.0.tar.gz
          sha256sum --check <<'CHECKSUMS'
          79b404eb5018ec958a1ca554640af40390b34547cb0393bdccfbe9d0e2895f57  dist/wadaya_moving_kit-0.1.0-py3-none-any.whl
          ae2d9d8c3ff48a6a6c9762dedda5ae83355b7f9e8e04ec13c1ddc1862c11d310  dist/wadaya_moving_kit-0.1.0.tar.gz
          CHECKSUMS
      - name: Validate the released package
        run: |
          python -m pip install twine dist/wadaya_moving_kit-0.1.0-py3-none-any.whl
          tar -xzf dist/wadaya_moving_kit-0.1.0.tar.gz -C "$RUNNER_TEMP"
          python -m unittest discover -s "$RUNNER_TEMP/wadaya_moving_kit-0.1.0/tests" -p 'test_*.py'
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
